[package]
name = "polarwave"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Runs Claude Code agents on a project's task queue: plans, implements, reviews, fixes, opens PRs and mirrors tasks to GitHub issues."
repository = "https://github.com/JeromeTrottier/polarwave"
readme = "README.md"
keywords = ["claude", "agents", "automation", "github"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
